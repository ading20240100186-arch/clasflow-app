<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="Tampilan_catatan.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#4f46e5">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <link rel="manifest" href="manifest.json">
        <title>CATATAN</title>
    </head>
    <body class="body">
        <div class="app-shell">
            <header class="app-header">
                <div class="header-badge">CashFlow</div>
                <h1 class="title">CATATAN</h1>
            </header>

            <div class="currency-panel">
                <label for="mata-uang">MATA UANG</label>
                <select id="mata-uang">
                    <option value="MYR">🇲🇾 Ringgit Malaysia (MYR)</option>
                    <option value="USD">🇺🇸 US Dollar (USD)</option>
                    <option value="SGD">🇸🇬 Singapore Dollar (SGD)</option>
                    <option value="EUR">🇪🇺 Euro (EUR)</option>
                    <option value="GBP">🇬🇧 Pound Sterling (GBP)</option>
                    <option value="IDR">🇮🇩 Rupiah Indonesia (IDR)</option>
                </select>
            </div>

            <div class="menu">
                <details class="menu-dropdown" open>
                    <summary>PENGELUARAN</summary>
                    <ul class="submenu">
                        <li><button type="button" class="tab-btn active" data-target="harian">HARIAN</button></li>
                        <li><button type="button" class="tab-btn" data-target="bulanan">BULANAN</button></li>
                        <li><button type="button" class="tab-btn" data-target="tahunan">TAHUNAN</button></li>
                    </ul>
                </details>
            </div>

            <button id="installBtn" class="install-btn hidden" type="button">
                <i class="fa-solid fa-download"></i>
                Install App
            </button>

            <div class="tabel-container tampil" id="tabel-harian">
                <h3>Belanja(HARIAN) </h3>
                <table id="tabel-belanja">
                    <thead>
                        <tr>
                            <th>Nama Barang</th>
                            <th>Jumlah Barang</th>
                            <th>Harga Barang</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="baris-data">
                            <td><input type="text" class="nama-barang" placeholder="Nama Barang"></td>
                            <td><input type="number" class="jumlah-barang" value="1" min="1"></td>
                            <td><input type="number" class="harga-barang" value="0" min="0"></td>
                            <td class="subtotal">0</td>
                            <td>
                                <button class="btn-hapus">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="tombol-tambah">
                    <button id="btn-tambah">
                        <i class="fa-solid fa-circle-plus"></i>
                        Tambah Baris
                    </button>
                </div>

                <div class="total-semua">
                    <strong>TOTAL SEMUA HARGA BARANG: </strong>
                    <span id="total-akhir">0</span>
                </div>

                <div class="save-panel">
                    <div class="save-row">
                        <label for="bulan-simpan-harian">Bulan</label>
                        <select id="bulan-simpan-harian">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                    </div>

                    <button type="button" id="simpan-harian" class="btn-simpan-harian">Simpan ke Bulanan</button>
                    <div class="share-actions">
                        <button type="button" class="btn-share whatsapp" data-section="tabel-harian" data-platform="whatsapp">WhatsApp</button>
                        <button type="button" class="btn-share telegram" data-section="tabel-harian" data-platform="telegram">Telegram</button>
                        <button type="button" class="btn-share copy" data-section="tabel-harian" data-platform="copy">Salin Teks</button>
                    </div>
                </div>
            </div>

            <div class="tabel-container" id="tabel-bulanan">
                <h3>Pengeluaran (Bulanan)</h3>
                <div class="periode-form">
                    <label for="bulan-pilih">Pilih Bulan</label>
                    <select id="bulan-pilih">
                        <option value="Januari">Januari</option>
                        <option value="Februari">Februari</option>
                        <option value="Maret">Maret</option>
                        <option value="April">April</option>
                        <option value="Mei">Mei</option>
                        <option value="Juni">Juni</option>
                        <option value="Juli">Juli</option>
                        <option value="Agustus">Agustus</option>
                        <option value="September">September</option>
                        <option value="Oktober">Oktober</option>
                        <option value="November">November</option>
                        <option value="Desember">Desember</option>
                    </select>

                    <div class="summary-box">
                        <span>Jumlah harian tersimpan:</span>
                        <strong id="hasil-bulanan-harian">RM 0.00</strong>
                    </div>

                    <label for="pengeluaran-bulanan">Jumlah Pengeluaran</label>
                    <input id="pengeluaran-bulanan" type="number" min="0" value="0" placeholder="Masukkan nominal">

                    <button type="button" id="simpan-bulanan" class="btn-simpan">Simpan</button>
                    <div class="share-actions">
                        <button type="button" class="btn-share whatsapp" data-section="tabel-bulanan" data-platform="whatsapp">WhatsApp</button>
                        <button type="button" class="btn-share telegram" data-section="tabel-bulanan" data-platform="telegram">Telegram</button>
                        <button type="button" class="btn-share copy" data-section="tabel-bulanan" data-platform="copy">Salin Teks</button>
                    </div>

                    <div class="ringkasan">
                        <span>Sudah tersimpan:</span>
                        <strong id="hasil-bulanan">RM 0.00</strong>
                    </div>
                </div>
            </div>

            <div class="tabel-container" id="tabel-tahunan">
                <h3>Pengeluaran (Tahunan)</h3>
                <div class="periode-form">
                    <label for="tahun-pilih">Pilih Tahun</label>
                    <select id="tahun-pilih"></select>

                    <label for="pengeluaran-tahunan">Jumlah Pengeluaran</label>
                    <input id="pengeluaran-tahunan" type="number" min="0" value="0" placeholder="Masukkan nominal" readonly>

                    <button type="button" id="simpan-tahunan" class="btn-simpan">Sinkronkan Tahun</button>
                    <div class="share-actions">
                        <button type="button" class="btn-share whatsapp" data-section="tabel-tahunan" data-platform="whatsapp">WhatsApp</button>
                        <button type="button" class="btn-share telegram" data-section="tabel-tahunan" data-platform="telegram">Telegram</button>
                        <button type="button" class="btn-share copy" data-section="tabel-tahunan" data-platform="copy">Salin Teks</button>
                    </div>

                    <div class="ringkasan">
                        <span>Sudah tersimpan:</span>
                        <strong id="hasil-tahunan">RM 0.00</strong>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const tableBody = document.querySelector('#tabel-belanja tbody');
            const totalAkhir = document.getElementById('total-akhir');
            const btnTambah = document.getElementById('btn-tambah');
            const bulanPilih = document.getElementById('bulan-pilih');
            const bulanSimpanHarian = document.getElementById('bulan-simpan-harian');
            const tahunPilih = document.getElementById('tahun-pilih');
            const mataUangSelect = document.getElementById('mata-uang');
            const pengeluaranBulanan = document.getElementById('pengeluaran-bulanan');
            const pengeluaranTahunan = document.getElementById('pengeluaran-tahunan');
            const hasilBulanan = document.getElementById('hasil-bulanan');
            const hasilBulananHarian = document.getElementById('hasil-bulanan-harian');
            const hasilTahunan = document.getElementById('hasil-tahunan');
            const simpanBulanan = document.getElementById('simpan-bulanan');
            const simpanTahunan = document.getElementById('simpan-tahunan');
            const simpanHarian = document.getElementById('simpan-harian');
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

            const configMataUang = {
                MYR: { locale: 'ms-MY', currency: 'MYR', minimumFractionDigits: 2, maximumFractionDigits: 2 },
                USD: { locale: 'en-US', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 },
                SGD: { locale: 'en-SG', currency: 'SGD', minimumFractionDigits: 2, maximumFractionDigits: 2 },
                EUR: { locale: 'de-DE', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 },
                GBP: { locale: 'en-GB', currency: 'GBP', minimumFractionDigits: 2, maximumFractionDigits: 2 },
                IDR: { locale: 'id-ID', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }
            };

            function formatRupiah(value) {
                const pilihan = configMataUang[mataUangSelect.value] || configMataUang.MYR;
                return new Intl.NumberFormat(pilihan.locale, {
                    style: 'currency',
                    currency: pilihan.currency,
                    minimumFractionDigits: pilihan.minimumFractionDigits,
                    maximumFractionDigits: pilihan.maximumFractionDigits
                }).format(Number(value) || 0);
            }

            function getStorage(key) {
                try {
                    return JSON.parse(localStorage.getItem(key)) || {};
                } catch (error) {
                    return {};
                }
            }

            function saveStorage(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }

            function getTahunAktif() {
                return Number(tahunPilih.value || new Date().getFullYear());
            }

            function getBulananAktif() {
                return bulanPilih.value || namaBulan[new Date().getMonth()];
            }

            function hitungTotalHarian() {
                let total = 0;
                document.querySelectorAll('.baris-data').forEach((row) => {
                    total += hitungSubtotal(row);
                });
                return total;
            }

            function getShareText(sectionId) {
                const mataUang = mataUangSelect.options[mataUangSelect.selectedIndex].text;

                if (sectionId === 'tabel-harian') {
                    return `Laporan Belanja Harian\nBulan: ${bulanSimpanHarian.value}\nTotal: ${totalAkhir.textContent}\nMata uang: ${mataUang}`;
                }

                if (sectionId === 'tabel-bulanan') {
                    return `Laporan Belanja Bulanan\nBulan: ${bulanPilih.value}\nTahun: ${tahunPilih.value}\nTotal: ${hasilBulanan.textContent}\nJumlah harian tersimpan: ${hasilBulananHarian.textContent}\nMata uang: ${mataUang}`;
                }

                return `Laporan Belanja Tahunan\nTahun: ${tahunPilih.value}\nTotal: ${hasilTahunan.textContent}\nMata uang: ${mataUang}`;
            }

            function bagikanSection(sectionId, platform = 'whatsapp') {
                const judul = {
                    'tabel-harian': 'Laporan Belanja Harian',
                    'tabel-bulanan': 'Laporan Belanja Bulanan',
                    'tabel-tahunan': 'Laporan Belanja Tahunan'
                }[sectionId] || 'Laporan Keuangan';

                const shareText = `${judul}\n\n${getShareText(sectionId)}`;
                const shareUrl = window.location.href;

                if (platform === 'copy') {
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(shareText).then(() => {
                            alert('Teks laporan berhasil disalin ke clipboard.');
                        }).catch(() => {
                            alert(shareText);
                        });
                    } else {
                        alert(shareText);
                    }
                    return;
                }

                if (platform === 'telegram') {
                    const telegramLink = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`;
                    window.open(telegramLink, '_blank', 'noopener');
                    return;
                }

                if (navigator.share) {
                    navigator.share({
                        title: judul,
                        text: shareText,
                        url: shareUrl
                    }).catch(() => {
                        const whatsappLink = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
                        window.open(whatsappLink, '_blank', 'noopener');
                    });
                    return;
                }

                const whatsappLink = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
                window.open(whatsappLink, '_blank', 'noopener');
            }

            function tampilkanTab(target) {
                document.querySelectorAll('.tabel-container').forEach((panel) => {
                    panel.classList.toggle('tampil', panel.id === `tabel-${target}`);
                });

                document.querySelectorAll('.tab-btn').forEach((button) => {
                    button.classList.toggle('active', button.dataset.target === target);
                });
            }

            function renderBulanan() {
                const bulan = getBulananAktif();
                const tahun = getTahunAktif();
                const dataBulanan = getStorage('dataBulanan');
                const dataHarian = getStorage('dataHarian');
                const nilai = Number(dataBulanan[tahun]?.[bulan] || 0);
                const totalHarianBulan = Number(dataHarian[tahun]?.[bulan] || 0);

                pengeluaranBulanan.value = nilai;
                hasilBulanan.textContent = formatRupiah(nilai);
                hasilBulananHarian.textContent = formatRupiah(totalHarianBulan);
            }

            function renderTahunan() {
                const tahun = getTahunAktif();
                const dataBulanan = getStorage('dataBulanan');
                const dataTahunan = getStorage('dataTahunan');
                const nilaiBulanan = Object.values(dataBulanan[tahun] || {}).reduce((sum, value) => sum + Number(value || 0), 0);
                const nilai = Number(dataTahunan[tahun] || nilaiBulanan || 0);

                if (!dataTahunan[tahun] || Number(dataTahunan[tahun]) !== nilaiBulanan) {
                    dataTahunan[tahun] = nilaiBulanan;
                    saveStorage('dataTahunan', dataTahunan);
                }

                pengeluaranTahunan.value = nilai;
                hasilTahunan.textContent = formatRupiah(nilai);
            }

            function syncMonthSelectors() {
                const bulanAktif = getBulananAktif();
                bulanPilih.value = bulanAktif;
                bulanSimpanHarian.value = bulanAktif;
            }

            mataUangSelect.addEventListener('change', () => {
                renderBulanan();
                renderTahunan();
                hitungTotal();
            });

            bulanPilih.addEventListener('change', () => {
                syncMonthSelectors();
                renderBulanan();
            });

            bulanSimpanHarian.addEventListener('change', () => {
                bulanPilih.value = bulanSimpanHarian.value;
                renderBulanan();
            });

            tahunPilih.addEventListener('change', () => {
                syncMonthSelectors();
                renderBulanan();
                renderTahunan();
            });

            simpanHarian.addEventListener('click', () => {
                const bulan = bulanSimpanHarian.value;
                const tahun = getTahunAktif();
                const totalHarian = hitungTotalHarian();
                const dataHarian = getStorage('dataHarian');
                const dataBulanan = getStorage('dataBulanan');

                if (!dataHarian[tahun]) {
                    dataHarian[tahun] = {};
                }
                if (!dataBulanan[tahun]) {
                    dataBulanan[tahun] = {};
                }

                dataHarian[tahun][bulan] = Number(dataHarian[tahun][bulan] || 0) + totalHarian;
                dataBulanan[tahun][bulan] = Number(dataBulanan[tahun][bulan] || 0) + totalHarian;

                saveStorage('dataHarian', dataHarian);
                saveStorage('dataBulanan', dataBulanan);
                syncMonthSelectors();
                renderBulanan();
                renderTahunan();
            });

            simpanBulanan.addEventListener('click', () => {
                const bulan = getBulananAktif();
                const tahun = getTahunAktif();
                const dataBulanan = getStorage('dataBulanan');
                const nilai = Number(pengeluaranBulanan.value) || 0;

                if (!dataBulanan[tahun]) {
                    dataBulanan[tahun] = {};
                }

                dataBulanan[tahun][bulan] = nilai;
                saveStorage('dataBulanan', dataBulanan);
                renderBulanan();
                renderTahunan();
            });

            simpanTahunan.addEventListener('click', () => {
                const tahun = getTahunAktif();
                const dataTahunan = getStorage('dataTahunan');
                const totalTahun = Object.values(getStorage('dataBulanan')[tahun] || {}).reduce((sum, value) => sum + Number(value || 0), 0);
                dataTahunan[tahun] = totalTahun;
                saveStorage('dataTahunan', dataTahunan);
                renderTahunan();
            });

            document.querySelectorAll('.tab-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    tampilkanTab(button.dataset.target);
                });
            });

            const tahunSekarang = new Date().getFullYear();
            for (let tahun = tahunSekarang - 5; tahun <= tahunSekarang + 10; tahun++) {
                const option = document.createElement('option');
                option.value = tahun;
                option.textContent = tahun;
                tahunPilih.appendChild(option);
            }
            tahunPilih.value = tahunSekarang;

            const bulanSekarang = namaBulan[new Date().getMonth()];
            bulanPilih.value = bulanSekarang;
            bulanSimpanHarian.value = bulanSekarang;

            function hitungSubtotal(row) {
                const jumlah = parseFloat(row.querySelector('.jumlah-barang').value) || 0;
                const harga = parseFloat(row.querySelector('.harga-barang').value) || 0;
                const subtotal = jumlah * harga;
                row.querySelector('.subtotal').textContent = formatRupiah(subtotal);
                return subtotal;
            }

            function hitungTotal() {
                const total = hitungTotalHarian();
                totalAkhir.textContent = formatRupiah(total);
            }

            function tambahBaris() {
                const barisBaru = document.createElement('tr');
                barisBaru.className = 'baris-data';
                barisBaru.innerHTML = `
                    <td><input type="text" class="nama-barang" placeholder="Nama Barang"></td>
                    <td><input type="number" class="jumlah-barang" value="1" min="1"></td>
                    <td><input type="number" class="harga-barang" value="0" min="0"></td>
                    <td class="subtotal">0</td>
                    <td>
                        <button class="btn-hapus" type="button">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;

                barisBaru.querySelector('.jumlah-barang').addEventListener('input', hitungTotal);
                barisBaru.querySelector('.harga-barang').addEventListener('input', hitungTotal);
                barisBaru.querySelector('.btn-hapus').addEventListener('click', () => {
                    barisBaru.remove();
                    hitungTotal();
                });

                tableBody.appendChild(barisBaru);
                hitungTotal();
            }

            document.querySelectorAll('.jumlah-barang').forEach((input) => {
                input.addEventListener('input', hitungTotal);
            });

            document.querySelectorAll('.harga-barang').forEach((input) => {
                input.addEventListener('input', hitungTotal);
            });

            document.querySelectorAll('.btn-hapus').forEach((button) => {
                button.addEventListener('click', () => {
                    button.closest('.baris-data').remove();
                    hitungTotal();
                });
            });

            document.querySelectorAll('.btn-share').forEach((button) => {
                button.addEventListener('click', () => {
                    bagikanSection(button.dataset.section, button.dataset.platform);
                });
            });

            btnTambah.addEventListener('click', tambahBaris);
            renderBulanan();
            renderTahunan();
            hitungTotal();

            const installBtn = document.getElementById('installBtn');
            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredPrompt = event;
                installBtn.classList.remove('hidden');
            });

            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) {
                    return;
                }

                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App installed');
                }
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(() => {
                        console.log('Service worker registration failed');
                    });
                });
            }
        </script>
    </body>
</html>
